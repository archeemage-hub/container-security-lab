services:
  store:
    image: "container-security-lab:1.0"
    pull_policy: never
    environment:
      APP_ROLE: store
    secrets:
      - source: backend-token
        target: backend-token
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)"
      interval: "3s"
      timeout: "3s"
      retries: 15
    volumes:
      - "notes:/data"
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m,mode=1777"
    mem_limit: "128m"
    cpus: 0.5
    pids_limit: 64
  gateway:
    image: "container-security-lab:1.0"
    pull_policy: never
    environment:
      APP_ROLE: gateway
    secrets:
      - source: backend-token
        target: backend-token
    networks:
      - backend
      - edge
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)"
      interval: "3s"
      timeout: "3s"
      retries: 15
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      store:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m,mode=1777"
    mem_limit: "128m"
    cpus: 0.5
    pids_limit: 64
secrets:
  backend-token:
    file: ".runtime/backend-token"
networks:
  edge: {}
  backend:
    internal: true
volumes:
  notes: {}
