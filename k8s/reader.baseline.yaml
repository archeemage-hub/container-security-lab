metadata:
  name: reader
  namespace: article-baseline
  labels:
    app: reader
spec:
  serviceAccountName: notes-app
  containers:
    - name: probe
      image: "container-security-lab:1.0"
      imagePullPolicy: Never
      command:
        - python
        - "-c"
        - "import time; time.sleep(86400)"
  securityContext:
    runAsUser: 0
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
apiVersion: v1
kind: Pod
