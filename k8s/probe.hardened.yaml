metadata:
  name: outsider
  namespace: article-secure
  labels:
    app: outsider
spec:
  serviceAccountName: notes-app
  containers:
    - name: probe
      image: "container-security-lab:1.0"
      imagePullPolicy: Never
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
      command:
        - python
        - "-c"
        - "import time; time.sleep(86400)"
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
apiVersion: v1
kind: Pod
